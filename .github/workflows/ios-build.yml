name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Build Web Assets
      run: |
        mkdir -p dist
        cp index.html dist/
        cp lightweight-charts.js dist/
        cp kyysis_logo.png dist/

    - name: Sync Capacitor
      run: npx cap sync ios

    - name: Resolve Swift Package Dependencies
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -resolvePackageDependencies

    - name: Build iOS (xcodebuild)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   -archivePath $PWD/build/App.xcarchive \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO

    - name: Export Unsigned IPA (Sideloadable)
      run: |
        cd ios/App/build
        mkdir -p Payload
        cp -r App.xcarchive/Products/Applications/App.app Payload/
        zip -r KyySIS_Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KyySIS-iOS-App
        path: ios/App/build/KyySIS_Unsigned.ipa
        retention-days: 7
